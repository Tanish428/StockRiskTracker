<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Dictionary | Admin</title>
    {% load static %}
    <style>
        :root {
            --bg-dark: #0f172a; --card-bg: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc; --text-secondary: #94a3b8;
            --primary: #3b82f6; --primary-hover: #2563eb;
            --red: #ef4444; --border: rgba(255,255,255,0.08); --border-accent: rgba(255,255,255,0.15);
            --transition: all 0.3s ease;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.1), transparent 50%); }
        
        .admin-navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: rgba(15, 23, 42, 0.8); border-bottom: 1px solid var(--border); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .admin-brand { display: flex; align-items: center; gap: 12px; }
        .admin-brand h2 { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .back-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-accent); color: var(--text-primary); padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; transition: var(--transition); }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--text-secondary); }

        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; width: 100%; }
        .page-header { margin-bottom: 30px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
        .page-header h1 { font-size: 28px; font-weight: 800; }
        
        /* Form Card */
        .form-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 25px; margin-bottom: 30px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .form-card h3 { font-size: 16px; margin-bottom: 15px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .add-form { display: flex; gap: 15px; }
        .add-form input { flex: 1; min-width: 200px; padding: 12px 16px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border); border-radius: 8px; color: var(--text-primary); font-size: 14px; transition: var(--transition); }
        .add-form input:nth-child(3) { flex: 2; } /* meaning input is wider */
        .add-form input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); background: rgba(15, 23, 42, 0.9); }
        .btn-submit { padding: 12px 24px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: var(--transition); white-space: nowrap; }
        .btn-submit:hover { background: #059669; transform: translateY(-1px); box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4); }

        /* Table */
        .table-container { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,255,255,0.03); padding: 16px 20px; font-size: 13px; text-transform: uppercase; color: var(--text-secondary); letter-spacing: 0.5px; border-bottom: 1px solid var(--border); }
        td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--text-primary); line-height: 1.5; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .action-cell { display: flex; gap: 10px; }
        .btn-edit { background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); color: #93c5fd; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); text-decoration: none; }
        .btn-edit:hover { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        .btn-delete { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); text-decoration: none; }
        .btn-delete:hover { background: var(--red); color: white; border-color: var(--red); box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
        
        @media(max-width: 768px) { .add-form { flex-direction: column; } }
    </style>
</head>
<body>

    <nav class="admin-navbar">
        <div class="admin-brand">
            <span style="font-size:24px;">📖</span>
            <h2>StockRiskTracker Admin</h2>
        </div>
        <a href="{% url 'admin_dashboard' %}" class="back-btn">← Back to Dashboard</a>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Dictionary Management</h1>
        </div>

        <div class="form-card">
            <h3>Add New Term</h3>
            <form method="POST" class="add-form">
                {% csrf_token %}
                <input type="text" name="term" placeholder="Enter financial term" required autocomplete="off">
                <input type="text" name="meaning" placeholder="Enter meaning or definition" required autocomplete="off">
                <button type="submit" class="btn-submit">+ Add Term</button>
            </form>
        </div>

        <div class="table-container">
            <table>
                <tr>
                    <th style="width: 25%;">Term</th>
                    <th style="width: 60%;">Meaning</th>
                    <th style="width: 15%;">Actions</th>
                </tr>
                {% for t in terms %}
                <tr>
                    <td><strong>{{ t.term }}</strong></td>
                    <td>{{ t.meaning }}</td>
                    <td class="action-cell">
                        <a href="{% url 'update_term' t.id %}" class="btn-edit">Edit</a>
                        <a href="{% url 'delete_term' t.id %}" class="btn-delete">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </table>
        </div>
    </div>

</body>
</html>
