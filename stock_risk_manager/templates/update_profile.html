<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Profile | StockRiskTracker</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/update_profile.css' %}">
</head>

<body>

<!-- 🔴 TOP ALERT -->
{% if messages %}
<div class="top-alert-container">
    {% for message in messages %}
        <div class="top-alert {{ message.tags }}">{{ message }}</div>
    {% endfor %}
</div>
{% endif %}

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-section">
            <div class="logo">📈</div>
            <h2>StockRiskTracker</h2>
        </div>

        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'wallet' %}">Wallet</a>
        <a href="{% url 'watchlist' %}">Watchlist</a>
        <a href="{% url 'investment_diary' %}">Investment Diary</a>
        <a href="{% url 'history' %}">History</a>
        <a href="{% url 'dictionary' %}">Dictionary</a>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>

    <!-- Main -->
    <div class="main">

        <div class="header-top">
            <h1>Update Profile</h1>
        </div>

        <div class="update-container">

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" value="{{ user.username }}" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required>
                </div>

                <div class="form-group">
                    <label>Old Password</label>
                    <input type="password" name="old_password" required>
                </div>

                <div class="form-group">
                    <label>New Password</label>
                    <!-- ❌ YOU HAD SPACE IN NAME → FIXED -->
                    <input type="password" name="new_password">
                </div>

                <button type="submit" class="update-btn">
                    Save Changes
                </button>

            </form>

        </div>

    </div>
</div>

<!-- AUTO HIDE ALERT -->
<script>
    setTimeout(() => {
        const alerts = document.querySelector('.top-alert-container');
        if (alerts) alerts.style.display = 'none';
    }, 4000);
</script>

</body>
</html>
