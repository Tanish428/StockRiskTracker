<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Profile | StockRiskTracker</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}">

    <style>
        .update-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #eee;
        }

        input:focus {
            border-color: #1f3c88;
            outline: none;
        }

        .update-btn {
            background: #1f3c88;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .update-btn:hover { background: #162a60; }
    </style>
</head>

<body>

<div class="container">

    <div class="sidebar">
        <div class="logo-section">
            <div class="logo">📈</div>
            <h2>StockRiskTracker</h2>
        </div>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'profile' %}" class="active">Profile</a>
        <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>

    <div class="main">

        <div class="header-top">
            <h1>Update Profile</h1>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div style="
                    margin-bottom: 15px;
                    padding: 12px;
                    border-radius: 8px;
                    color: white;
                    background: {% if message.tags == 'error' %}#e74c3c{% else %}#2ecc71{% endif %};">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="update-container">

            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" value="{{ user.username }}" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" value="{{ user.email }}" required>
                </div>

                <div class="form-group">
                    <label>Old Password (Required)</label>
                    <input type="password" name="old_password" required>
                </div>

                <div class="form-group">
                    <label>New Password (Optional)</label>
                    <input type="password" name="new_password">
                </div>

                <button type="submit" class="update-btn">
                    Save Changes
                </button>

            </form>

        </div>

    </div>
</div>

</body>
</html>
