<!DOCTYPE html>
<html>
<head>
    <title>Wallet | StockRiskTracker</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/wallet.css' %}">
</head>

<body>

<div class="container">

       <div class="sidebar">
        <div class="logo-section">
            <div class="logo">📈</div>
            <h2>StockRiskTracker</h2>
        </div>

       <a href="{% url 'dashboard' %}">Dashboard</a>
       <a href="#" class="active">Wallet</a>
            <a href="{% url 'watchlist' %}">Watchlist</a>
            <a href="{% url 'investment_diary' %}">Investment Diary</a>
            <a href="{% url 'history' %}">History</a>
            <a href="{% url 'dictionary' %}">Dictionary</a>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
    </div>
  

    <div class="main">

        <div class="header-top">
            <h1>Virtual Trading Wallet</h1>
        </div>

        <div class="wallet-card">
            <h2>Available Balance</h2>
            <div class="balance">₹ {{ profile.wallet_balance }}</div>
        </div>

        <div class="wallet-actions">

            <!-- Add Money Section -->
            <div class="action-section">
                <h3>💰 Add Money</h3>
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="ADD">
                    <div class="amount-buttons">
                        <button type="submit" name="amount" value="1000" class="amount-btn">₹ 1,000</button>
                        <button type="submit" name="amount" value="5000" class="amount-btn">₹ 5,000</button>
                        <button type="submit" name="amount" value="10000" class="amount-btn">₹ 10,000</button>
                        <button type="submit" name="amount" value="50000" class="amount-btn">₹ 50,000</button>
                    </div>
                </form>
            </div>

            <!-- Withdraw Money Section -->
            <div class="action-section">
                <h3>🏦 Withdraw Money</h3>
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="action" value="WITHDRAW">
                    <div class="amount-buttons">
                        <button type="submit" name="amount" value="1000" class="amount-btn">₹ 1,000</button>
                        <button type="submit" name="amount" value="5000" class="amount-btn">₹ 5,000</button>
                        <button type="submit" name="amount" value="10000" class="amount-btn">₹ 10,000</button>
                        <button type="submit" name="amount" value="50000" class="amount-btn">₹ 50,000</button>
                    </div>
                </form>
            </div>

        </div>

    </div>
</div>

</body>
</html>
