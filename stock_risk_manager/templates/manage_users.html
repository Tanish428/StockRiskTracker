{% load static %}
<link rel="stylesheet" href="{% static 'css/admin.css' %}">
<h2>All Users</h2>


<table border="1">

<tr>
    <th>Username</th>
    <th>Email</th>
    <th>Date Joined</th>
    <th>Role</th>
    <th>Action</th>
</tr>

{% for u in users %}
<tr>
    <td>{{ u.username }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.date_joined }}</td>

    <td>
        {% if u.is_superuser %}
            Admin
        {% else %}
            User
        {% endif %}
    </td>

    <td>
        {% if u.id != request.user.id %}
        <a href="{% url 'delete_user' u.id %}">
            <button style="background:red;color:white;">Delete</button>
        </a>
        {% else %}
            ---
        {% endif %}
    </td>

</tr>
{% endfor %}

</table>

<br><br>
<a href="{% url 'admin_dashboard' %}">
    <button>Back to Admin Dashboard</button>
</a>
